<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today — one list at a time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F4F1}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button,input{font:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.task .del{opacity:0}
.task:hover .del,.task .del:focus-visible{opacity:1}
.task:hover{background:#F7F8F5}
.navbtn:hover{background:#FFFFFF}
@media (hover:none){.task .del{opacity:1}}
input:focus-visible,button:focus-visible{outline:2px solid #15171C;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F3F4F1; color: #15171C; font-family: 'Figtree', system-ui, sans-serif; padding: clamp(20px, 4vw, 56px) clamp(16px, 4vw, 48px)">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<aside style="flex: 1 1 240px; max-width: 100%; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 15px; font-weight: 600; color: #5B616E">{{greeting}}, Jaden</p>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em">{{today}}</p>
</div>
<nav aria-label="Lists" style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<button type="button" class="navbtn" onClick="{{n.pick}}" aria-current="{{n.current}}" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid {{n.border}}; background: {{n.bg}}; color: #15171C; font-size: 16px; font-weight: {{n.weight}}; cursor: pointer; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 12px; height: 12px; border-radius: 4px; background: {{n.color}}; flex: none"></span>
<span style="flex: 1">{{n.name}}</span>
<span style="font-size: 13px; font-weight: 600; color: {{n.badgeFg}}; background: {{n.badgeBg}}; min-width: 26px; padding: 3px 8px; border-radius: 999px; text-align: center; box-sizing: border-box">{{n.left}}</span>
</button>
</sc-for>
</nav>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E5E0">
<div style="display: flex; justify-content: space-between; font-size: 14px">
<span style="font-weight: 600">Whole day</span>
<span style="color: #5B616E">{{doneCount}} of {{totalCount}} done</span>
</div>
<div style="height: 8px; border-radius: 999px; background: #E3E5E0; overflow: hidden; display: flex">
<sc-for list="{{segments}}" as="seg" hint-placeholder-count="3">
<div style="height: 100%; width: {{seg.width}}; background: {{seg.color}}"></div>
</sc-for>
</div>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E5E0; border-radius: 28px; padding: clamp(20px, 3vw, 40px); display: flex; flex-direction: column; gap: 24px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<span style="width: 18px; height: 18px; border-radius: 6px; background: {{cur.color}}"></span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(36px, 5vw, 52px); line-height: 1; font-weight: 700; letter-spacing: -0.02em">{{cur.name}}</h1>
</div>
<p style="margin: 0; font-size: 16px; color: #5B616E">{{cur.summary}}</p>
<div style="height: 6px; border-radius: 999px; background: #EEF0EC; overflow: hidden">
<div style="height: 100%; width: {{cur.pct}}; background: {{cur.color}}"></div>
</div>
</div>

<form onSubmit="{{addTask}}" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px; border-radius: 16px; background: #F3F4F1">
<label for="cat-new-task" class="sr-only">New task</label>
<input id="cat-new-task" type="text" placeholder="{{cur.placeholder}}" value="{{draft}}" onChange="{{onDraft}}" style="flex: 1 1 240px; min-width: 0; height: 48px; border: 0; border-radius: 12px; background: #FFFFFF; font-size: 17px; padding: 0 14px; color: #15171C">
<label for="cat-new-time" class="sr-only">Time (optional)</label>
<input id="cat-new-time" type="time" value="{{draftTime}}" onChange="{{onTime}}" style="height: 48px; border: 0; border-radius: 12px; padding: 0 12px; color: #15171C; background: #FFFFFF">
<button type="submit" style="height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: {{cur.color}}; color: #FFFFFF; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add
</button>
</form>

<section aria-labelledby="todo-h" style="display: flex; flex-direction: column; gap: 6px">
<h2 id="todo-h" style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5B616E">To do</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{open}}" as="t" hint-placeholder-count="3">
<li class="task" style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 0; border-radius: 14px">
<button type="button" onClick="{{t.toggle}}" aria-label="{{t.checkLabel}}" aria-pressed="{{t.done}}" style="flex: none; width: 48px; height: 48px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 9px; border: 2px solid {{t.ring}}; background: {{t.fill}}; display: flex; align-items: center; justify-content: center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.tick}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
</button>
<span style="flex: 1; min-width: 0; font-size: 18px; font-weight: 500; line-height: 1.3; color: {{t.ink}}; text-decoration: {{t.deco}}; overflow-wrap: anywhere; padding: 10px 0">{{t.title}}</span>
<sc-if value="{{t.hasTime}}" hint-placeholder-val="{{true}}">
<span style="flex: none; font-size: 14px; font-weight: 600; color: {{t.timeFg}}; background: {{t.timeBg}}; padding: 5px 10px; border-radius: 999px">{{t.time}}</span>
</sc-if>
<button type="button" class="del" onClick="{{t.remove}}" aria-label="{{t.removeLabel}}" style="flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: #5B616E; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>
</button>
</li>
</sc-for>
</ul>
<sc-if value="{{noOpen}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 14px 0; font-size: 16px; color: #5B616E">{{emptyText}}</p>
</sc-if>
</section>

<sc-if value="{{hasDone}}" hint-placeholder-val="{{true}}">
<section style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #E3E5E0; padding-top: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<button type="button" onClick="{{toggleShowDone}}" aria-expanded="{{showDone}}" style="min-height: 44px; padding: 0 8px 0 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5B616E">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{chevron}}); transition: transform 150ms"><path d="M9 6l6 6-6 6"></path></svg>
Completed ({{doneList.length}})
</button>
<button type="button" onClick="{{clearDone}}" style="min-height: 44px; padding: 0 14px; border: 1px solid #D5D8D1; border-radius: 10px; background: #FFFFFF; color: #15171C; font-size: 14px; font-weight: 600; cursor: pointer">Clear completed</button>
</div>
<sc-if value="{{showDone}}" hint-placeholder-val="{{true}}">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{doneList}}" as="t" hint-placeholder-count="2">
<li class="task" style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 0; border-radius: 14px">
<button type="button" onClick="{{t.toggle}}" aria-label="{{t.checkLabel}}" aria-pressed="{{t.done}}" style="flex: none; width: 48px; height: 48px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 9px; border: 2px solid {{t.ring}}; background: {{t.fill}}; display: flex; align-items: center; justify-content: center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.tick}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
</button>
<span style="flex: 1; min-width: 0; font-size: 18px; font-weight: 500; line-height: 1.3; color: {{t.ink}}; text-decoration: {{t.deco}}; overflow-wrap: anywhere; padding: 10px 0">{{t.title}}</span>
<button type="button" class="del" onClick="{{t.remove}}" aria-label="{{t.removeLabel}}" style="flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: #5B616E; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>
</button>
</li>
</sc-for>
</ul>
</sc-if>
</section>
</sc-if>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.nextId = 100;
    this.state = {
      tasks: [
        { id: 1, cat: 'personal', title: 'Morning run', time: '06:30', done: true },
        { id: 2, cat: 'personal', title: 'Buy groceries for the week', time: '17:30', done: false },
        { id: 3, cat: 'personal', title: 'Call Mom', time: '19:00', done: false },
        { id: 4, cat: 'personal', title: 'Pay the electricity bill', time: '', done: false },
        { id: 5, cat: 'work', title: 'Reply to client emails', time: '08:30', done: true },
        { id: 6, cat: 'work', title: 'Team stand-up', time: '09:30', done: true },
        { id: 7, cat: 'work', title: 'Finish the project update slides', time: '14:00', done: false },
        { id: 8, cat: 'work', title: 'Book flights for next week', time: '', done: false },
        { id: 9, cat: 'school', title: 'Read chapter 5 before class', time: '11:00', done: false },
        { id: 10, cat: 'school', title: 'Study group', time: '16:00', done: false },
        { id: 11, cat: 'school', title: 'Submit assignment 2', time: '23:00', done: false }
      ],
      active: 'work',
      draft: '',
      draftTime: '',
      showDone: true
    };
  }

  cats() {
    return [
      { id: 'personal', name: 'Personal', color: '#C2410C', soft: '#FFF1E7', placeholder: 'Add something personal…' },
      { id: 'work', name: 'Work', color: '#1D4ED8', soft: '#EAF0FF', placeholder: 'Add a work task…' },
      { id: 'school', name: 'School', color: '#15803D', soft: '#E8F6EC', placeholder: 'Add a school task…' }
    ];
  }

  renderVals() {
    const s = this.state;
    const cats = this.cats();
    const tasks = s.tasks;
    const c = cats.find((x) => x.id === s.active) || cats[0];
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const today = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

    const byTime = (a, b) => (a.time || '99:99').localeCompare(b.time || '99:99');
    const list = tasks.filter((t) => t.cat === c.id);
    const openT = list.filter((t) => !t.done).sort(byTime);
    const doneT = list.filter((t) => t.done).sort(byTime);

    const mkTask = (t) => ({
      id: t.id,
      title: t.title,
      time: t.time,
      hasTime: !!t.time,
      done: t.done,
      checkLabel: (t.done ? 'Mark as not done: ' : 'Mark as done: ') + t.title,
      removeLabel: 'Delete task: ' + t.title,
      ring: t.done ? c.color : '#B3B8B0',
      fill: t.done ? c.color : '#FFFFFF',
      tick: t.done ? '#FFFFFF' : 'transparent',
      ink: t.done ? '#6B7280' : '#15171C',
      deco: t.done ? 'line-through' : 'none',
      timeFg: c.color,
      timeBg: c.soft,
      toggle: () => this.setState((st) => ({ tasks: st.tasks.map((x) => (x.id === t.id ? Object.assign({}, x, { done: !x.done }) : x)) })),
      remove: () => this.setState((st) => ({ tasks: st.tasks.filter((x) => x.id !== t.id) }))
    });

    const nav = cats.map((n) => {
      const isCur = n.id === c.id;
      const left = tasks.filter((t) => t.cat === n.id && !t.done).length;
      return {
        name: n.name,
        color: n.color,
        left: left,
        current: isCur ? 'page' : 'false',
        bg: isCur ? '#FFFFFF' : 'transparent',
        border: isCur ? '#D5D8D1' : 'transparent',
        weight: isCur ? 700 : 500,
        badgeBg: isCur ? n.color : '#E3E5E0',
        badgeFg: isCur ? '#FFFFFF' : '#15171C',
        pick: () => this.setState({ active: n.id, draft: '', draftTime: '' })
      };
    });

    const segments = cats.map((n) => {
      const k = tasks.filter((t) => t.cat === n.id && t.done).length;
      return { color: n.color, width: total ? (k / total) * 100 + '%' : '0%' };
    });

    const summary = list.length === 0
      ? 'No tasks yet.'
      : openT.length === 0
        ? 'Everything here is done.'
        : openT.length + ' to do · ' + doneT.length + ' done';

    return {
      greeting: greeting,
      today: today,
      doneCount: done,
      totalCount: total,
      segments: segments,
      nav: nav,
      cur: {
        name: c.name,
        color: c.color,
        placeholder: c.placeholder,
        summary: summary,
        pct: list.length ? Math.round((doneT.length / list.length) * 100) + '%' : '0%'
      },
      open: openT.map(mkTask),
      doneList: doneT.map(mkTask),
      noOpen: openT.length === 0,
      hasDone: doneT.length > 0,
      emptyText: list.length === 0 ? 'Nothing on this list yet. Add your first task above.' : 'All clear. Enjoy the free time.',
      showDone: s.showDone,
      chevron: s.showDone ? '90deg' : '0deg',
      draft: s.draft,
      draftTime: s.draftTime,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onTime: (e) => this.setState({ draftTime: e.target.value }),
      toggleShowDone: () => this.setState((st) => ({ showDone: !st.showDone })),
      clearDone: () => this.setState((st) => ({ tasks: st.tasks.filter((t) => !(t.cat === st.active && t.done)) })),
      addTask: (e) => {
        e.preventDefault();
        const title = this.state.draft.trim();
        if (!title) return;
        const id = this.nextId++;
        this.setState((st) => ({
          tasks: st.tasks.concat([{ id: id, cat: st.active, title: title, time: st.draftTime, done: false }]),
          draft: '',
          draftTime: ''
        }));
      }
    };
  }
}
</script>
</body>
</html>
